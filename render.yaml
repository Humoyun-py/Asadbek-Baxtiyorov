services:
  - type: web
    name: asadbek-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/docs/
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: asadbek-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: asadbek-api.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://asadbek-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://asadbek-baxtiyorov.netlify.app
      - key: ADMIN_PANEL_URL
        value: https://asadbek-baxtiyorov.netlify.app/admin
      - key: WEB_CONCURRENCY
        value: "2"
      - key: ADMIN_EMAIL
        value: baxt1yorovasadbek.org@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
databases:
  - name: asadbek-db
    plan: free
